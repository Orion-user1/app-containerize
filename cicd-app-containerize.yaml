pipeline:
  name: App Containerize
  identifier: cicd_app_containerize
  description: Containerize applications with security validation and signing

  stages:
    - stage:
        name: App Containerize
        identifier: app_containerize
        type: CI

        spec:
          cloneCodebase: true

          execution:
            steps:
              - step:
                  type: Run
                  name: Container file lint
                  identifier: container_file_lint
                  spec:
                    shell: Bash
                    command: python3 devops-automation/scripts/container_file_lint.py

              - step:
                  type: Run
                  name: Create Image
                  identifier: create_image
                  spec:
                    shell: Bash
                    command: python3 devops-automation/scripts/create_image.py

              - step:
                  type: Run
                  name: SCA Scan on Image
                  identifier: sca_scan_image
                  spec:
                    shell: Bash
                    command: python3 devops-automation/scripts/blackduck_image_scan.py

              - step:
                  type: Run
                  name: Vulnerability Check
                  identifier: vulnerability_check
                  spec:
                    shell: Bash
                    command: python3 devops-automation/scripts/vulnerability_check.py

              - step:
                  type: Run
                  name: Create SBOM
                  identifier: create_sbom
                  spec:
                    shell: Bash
                    command: python3 devops-automation/scripts/create_sbom.py

              - step:
                  type: Run
                  name: Publish Image
                  identifier: publish_image
                  spec:
                    shell: Bash
                    command: python3 devops-automation/scripts/publish_image.py

              - step:
                  type: Run
                  name: Record Image Digest
                  identifier: record_image_digest
                  spec:
                    shell: Bash
                    command: python3 devops-automation/scripts/create_image_digest.py

              - step:
                  type: Run
                  name: Image and Digest attestation
                  identifier: image_digest_attestation
                  spec:
                    shell: Bash
                    command: python3 devops-automation/scripts/cosign_attestation.py
