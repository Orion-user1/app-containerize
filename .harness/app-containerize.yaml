pipeline:
  id: java_ci_remote
  name: java_ci_remote
  description: CI pipeline for a Java Maven app with lint, secret scan, dependency install, build, unit test, SAST and SCA.
  tags:
    ai_generated: ""
  clone:
    enabled: true
    connector: connector_Github_5257
    repo: Orion-user1/app-containerize
    ref:
      type: branch
      name: main
  stages:
    - id: java_ci_stage
      name: Java CI
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - id: lint
          name: Lint
          run:
            container:
              image: maven:3.9-eclipse-temurin-17
            script: mvn -B checkstyle:check
        - id: secret_scan
          name: Secret Scan
          template:
            uses: gitleaksStep
        - id: install_dependencies
          name: Install Dependencies
          run:
            container:
              image: maven:3.9-eclipse-temurin-17
            script: mvn -B dependency:resolve
        - id: build
          name: Build Application
          run:
            container:
              image: maven:3.9-eclipse-temurin-17
            script: mvn -B package -DskipTests
        - id: unit_test
          name: Unit Test
          run-test:
            container:
              image: maven:3.9-eclipse-temurin-17
            script: mvn -B test
        - id: sast_scan
          name: SAST Scan
          template:
            uses: semgrepStep
        - id: sca_scan
          name: SCA Scan
          template:
            uses: osvStep
